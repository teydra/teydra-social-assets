<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs><radialGradient id="g" cx="72%" cy="22%" r="80%"><stop offset="0%" stop-color="#143b55"/><stop offset="45%" stop-color="#0b1421"/><stop offset="100%" stop-color="#070910"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><rect x="54" y="52" width="972" height="1246" rx="42" fill="#070a12" fill-opacity=".68" stroke="#34465c" stroke-width="2"/><text x="74" y="88" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#8fa0b5">TEYDRA / TRUST SYSTEMS  ·  5/5</text><line x1="74" y1="115" x2="1006" y2="115" stroke="#263446" stroke-width="2"/><rect x="150" y="360" width="780" height="160" rx="32" fill="#ff546e"/><text x="205" y="460" font-family="DejaVu Sans, Arial" font-weight="700" font-size="44" fill="#0a0c12">IDENTITÄT PRÜFEN</text><rect x="210" y="560" width="660" height="90" rx="26" fill="none" stroke="#52e2ff" stroke-width="3"/><text x="255" y="615" font-family="DejaVu Sans Mono, monospace" font-size="31" fill="#beeaff">nicht nur wiedererkennen</text><text font-family="DejaVu Sans, Arial" font-size="76" font-weight="700" fill="#f5f8ff"><tspan x="88" y="245">Neue Regel:</tspan></text><text font-family="DejaVu Sans, Arial" font-size="38" font-weight="400" fill="#d3deec"><tspan x="88" y="765">Wenn Geld, Zugang oder Verantwortung</tspan><tspan x="88" y="816">bewegt wird, gehört Identität in den</tspan><tspan x="88" y="868">Prozess — nicht in die Stimme.</tspan><tspan x="88" y="919"></tspan><tspan x="88" y="970">Die Stimme kann täuschen.</tspan><tspan x="88" y="1022">Der Ablauf darf es nicht.</tspan></text><text x="74" y="1250" font-family="DejaVu Sans Mono, monospace" font-size="23" fill="#8b9cb2">Identität ist ein Ablauf. Kein Gefühl.</text></svg>