<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef7f6"/>
      <stop offset="1" stop-color="#fff8e6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#10212e" flood-opacity="0.17"/>
    </filter>
    <style>
      .brand { font: 700 29px "DejaVu Sans", Arial, sans-serif; fill: #122033; letter-spacing: 0; }
      .kicker { font: 700 22px "DejaVu Sans", Arial, sans-serif; fill: #0d9488; letter-spacing: 0; }
      .title { font: 800 69px "DejaVu Sans", Arial, sans-serif; fill: #122033; letter-spacing: 0; }
      .subtitle { font: 500 29px "DejaVu Sans", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 500 21px "DejaVu Sans", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .chip { font: 700 31px "DejaVu Sans", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .chipSub { font: 500 22px "DejaVu Sans", Arial, sans-serif; fill: rgba(255,255,255,0.9); letter-spacing: 0; }
      .panelTitle { font: 800 29px "DejaVu Sans", Arial, sans-serif; fill: #122033; letter-spacing: 0; }
      .panelText { font: 500 23px "DejaVu Sans", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .bottom { font: 800 36px "DejaVu Sans", Arial, sans-serif; fill: #122033; letter-spacing: 0; }
      .disclosure { font: 600 19px "DejaVu Sans", Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <circle cx="920" cy="132" r="110" fill="#f59e0b" opacity="0.14"/>
  <circle cx="109" cy="1118" r="150" fill="#0d9488" opacity="0.12"/>
  <circle cx="972" cy="1127" r="190" fill="#2563eb" opacity="0.08"/>

  <g transform="translate(72 65)">
    <g transform="translate(0 2)">
      <path d="M6 31 L34 5 L48 43 L29 32 L22 50 Z" fill="none" stroke="#60a5fa" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 31 L29 32 L34 5" fill="none" stroke="#60a5fa" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="brand" x="62" y="33">Teydra Lab</text>
    <rect x="632" y="-8" width="304" height="43" rx="21" fill="#ffffff" stroke="#d5dde8"/>
    <text class="disclosure" x="655" y="20">Virtuelle Produktvisualisierung</text>
  </g>

  <g transform="translate(72 164)">
    <text class="kicker" x="0" y="0">AI Act rückt näher</text>
    <text class="title" x="0" y="88">KI-Transparenz</text>
    <text class="title" x="0" y="171">vor der ersten Antwort</text>
    <text class="subtitle" x="0" y="226">Nicht später erklären. Früher Vertrauen bauen.</text>
  </g>

  <g transform="translate(92 425)" filter="url(#shadow)">
    <rect x="0" y="0" width="896" height="690" rx="34" fill="url(#panel)" stroke="#d6e1eb" stroke-width="2"/>
    <rect x="0" y="0" width="896" height="84" rx="34" fill="#122033"/>
    <circle cx="45" cy="42" r="11" fill="#ef4444"/>
    <circle cx="80" cy="42" r="11" fill="#f59e0b"/>
    <circle cx="115" cy="42" r="11" fill="#10b981"/>
    <text x="700" y="51" text-anchor="end" class="small" fill="#cbd5e1">Chat vor Antwort</text>

    <g transform="translate(64 128)">
      <rect x="0" y="0" width="395" height="68" rx="25" fill="#eaf1f7"/>
      <text x="28" y="43" class="panelText">Ich brauche Hilfe...</text>
      <path d="M420 34 L475 34" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <path d="M463 22 L477 34 L463 46" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(506 -38)">
        <rect x="0" y="0" width="260" height="146" rx="26" fill="#f8fafc" stroke="#dbe5ee"/>
        <text x="130" y="55" text-anchor="middle" class="panelTitle">Antwort</text>
        <text x="130" y="93" text-anchor="middle" class="panelText">erst nach</text>
        <text x="130" y="125" text-anchor="middle" class="panelText">Klarheit</text>
      </g>
    </g>

    <g transform="translate(106 282)">
      <rect x="0" y="0" width="684" height="96" rx="30" fill="#0d9488"/>
      <text class="chip" x="38" y="42">KI sichtbar</text>
      <text class="chipSub" x="38" y="73">Der Nutzer weiß, dass keine Person antwortet.</text>
      <circle cx="617" cy="48" r="28" fill="rgba(255,255,255,0.2)"/>
      <path d="M603 49 L614 60 L636 35" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(106 408)">
      <rect x="0" y="0" width="684" height="96" rx="30" fill="#2563eb"/>
      <text class="chip" x="38" y="42">Wissen klar</text>
      <text class="chipSub" x="38" y="73">Der Bot erklärt, worauf seine Antwort beruht.</text>
      <circle cx="617" cy="48" r="28" fill="rgba(255,255,255,0.2)"/>
      <path d="M603 49 L614 60 L636 35" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(106 534)">
      <rect x="0" y="0" width="684" height="96" rx="30" fill="#f59e0b"/>
      <text class="chip" x="38" y="42">Mensch erreichbar</text>
      <text class="chipSub" x="38" y="73">Übergabe ist sichtbar, bevor Vertrauen weg ist.</text>
      <circle cx="617" cy="48" r="28" fill="rgba(255,255,255,0.24)"/>
      <path d="M603 49 L614 60 L636 35" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(72 1214)">
    <text class="bottom" x="0" y="0">Transparenz ist UX.</text>
    <text class="subtitle" x="0" y="47">Nicht Kleingedrucktes.</text>
  </g>
</svg>
