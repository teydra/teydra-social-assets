<text x="82" y="260" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fbff" letter-spacing="-1.5">Den nächsten</text>
<text x="82" y="344" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fbff" letter-spacing="-1.5">Kaufbutton</text>
<text x="82" y="428" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fbff" letter-spacing="-1.5">drückt vielleicht</text>
<text x="82" y="513" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fbff" letter-spacing="-1.5">nicht mehr</text>
<text x="82" y="597" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fbff" letter-spacing="-1.5">der Kunde.</text>
<text x="86" y="790" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="520" fill="#b7c4d6">Ein Agent-Cursor nähert sich dem Kaufbutton —</text>
<text x="86" y="832" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="520" fill="#b7c4d6">der Moment wirkt bequem, aber</text>
<text x="86" y="874" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="520" fill="#b7c4d6">nicht harmlos.</text>
<text x="82" y="988" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#53657d">Agentic Commerce / Zustimmung / Vertrauen</text>
