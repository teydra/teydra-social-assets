<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f18"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#17120d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .h{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-weight:700;fill:#f4f0e8}
      .p{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-weight:400;fill:#c9d3df}
      .darkH{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-weight:700;fill:#0b1018}
      .darkP{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-weight:400;fill:#394150}
      .mono{font-family:DejaVu Sans Mono,monospace;font-weight:700;fill:#0b1018}
    </style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <text x="72" y="250" class="h" font-size="82">Die Wahrheit</text>
  <text x="72" y="350" class="h" font-size="82">steckt in der Kette.</text>
  <text x="72" y="448" class="p" font-size="34">Nicht in einem Aufkleber am Ende.</text>

  <rect x="112" y="620" width="856" height="180" rx="34" fill="#f4f0e8"/>
  <text x="155" y="712" class="mono" font-size="38">01</text>
  <text x="255" y="705" class="darkH" font-size="46">Wo kam das Bild her?</text>
  <text x="255" y="756" class="darkP" font-size="27">Capture, Modell, Quelle, Ursprung</text>

  <rect x="112" y="870" width="856" height="180" rx="34" fill="#101722" stroke="#2fe6ff" stroke-width="3"/>
  <text x="155" y="962" font-family="DejaVu Sans Mono,monospace" font-size="38" font-weight="700" fill="#2fe6ff">02</text>
  <text x="255" y="955" class="h" font-size="46">Wer hat signiert?</text>
  <text x="255" y="995" class="p" font-size="27">Ein glaubwuerdiger Nachweis</text>
  <text x="255" y="1032" class="p" font-size="27">braucht einen Aussteller.</text>

  <rect x="112" y="1120" width="856" height="180" rx="34" fill="#101722" stroke="#ffbe4d" stroke-width="3"/>
  <text x="155" y="1212" font-family="DejaVu Sans Mono,monospace" font-size="38" font-weight="700" fill="#ffbe4d">03</text>
  <text x="255" y="1205" class="h" font-size="46">Was wurde veraendert?</text>
  <text x="255" y="1256" class="p" font-size="27">Bearbeitung, Zuschnitt, Re-Encoding, Kontext.</text>

  <path d="M540 1440 C540 1495 540 1555 540 1610" stroke="#2fe6ff" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="540" cy="1645" r="70" fill="#2fe6ff" filter="url(#glow)"/>
  <text x="540" y="1658" font-family="DejaVu Sans,Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#071016" text-anchor="middle">prüfbar</text>
</svg>
