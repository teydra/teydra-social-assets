<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="0.58" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-weight:700;fill:#f4f0e8}
      .small{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-weight:400;fill:#b8c2d1}
      .node{fill:#101722;stroke:#2e3a4d;stroke-width:3}
      .nodeText{font-family:DejaVu Sans,Inter,Arial,sans-serif;font-size:32px;font-weight:700;fill:#f4f0e8;text-anchor:middle}
    </style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="64" y="72" width="310" height="50" rx="25" fill="#ffbe4d"/>
  <text x="92" y="106" font-family="DejaVu Sans,Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#11151c">CONTENT TRUST</text>
  <text x="72" y="290" class="label" font-size="88">Ein KI-Label</text>
  <text x="72" y="392" class="label" font-size="88">ist kein</text>
  <text x="72" y="494" class="label" font-size="88">Vertrauensbeweis.</text>
  <text x="72" y="590" class="small" font-size="34">Es markiert einen Moment.</text>
  <text x="72" y="640" class="small" font-size="34">Nicht die ganze Geschichte.</text>

  <line x1="200" y1="1030" x2="880" y2="1030" stroke="#263448" stroke-width="10" stroke-linecap="round"/>
  <line x1="200" y1="1030" x2="880" y2="1030" stroke="#2fe6ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="200" cy="1030" r="58" class="node"/><text x="200" y="1042" class="nodeText">Quelle</text>
  <circle cx="426" cy="1030" r="58" class="node"/><text x="426" y="1042" class="nodeText">Signatur</text>
  <circle cx="654" cy="1030" r="58" class="node"/><text x="654" y="1042" class="nodeText">Upload</text>
  <circle cx="880" cy="1030" r="58" class="node"/><text x="880" y="1042" class="nodeText">Feed</text>

  <rect x="72" y="1308" width="936" height="270" rx="34" fill="#0f1621" stroke="#2a3444" stroke-width="3"/>
  <text x="118" y="1394" class="label" font-size="44">Die Frage ist nicht nur:</text>
  <text x="118" y="1466" class="label" font-size="52" fill="#2fe6ff">"War KI beteiligt?"</text>
  <text x="118" y="1548" class="small" font-size="34">Sondern: bleibt der Nachweis lesbar?</text>
</svg>
